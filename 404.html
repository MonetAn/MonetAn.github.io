<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Страница не найдена</title>
    <script>
      (() => {
        const target = "https://product-portfolio.dodo-ai-platform.io";
        const oldBase = "/Product-Profiolio-DE";
        const path = window.location.pathname;

        if (path === oldBase || path.startsWith(`${oldBase}/`)) {
          const suffix = path.slice(oldBase.length) || "/";
          window.location.replace(
            target + suffix + window.location.search + window.location.hash
          );
        }
      })();
    </script>
  </head>
  <body>
    <h1>404</h1>
    <p>Страница не найдена.</p>
  </body>
</html>
